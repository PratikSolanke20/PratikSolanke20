<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2F1FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d47" stroke-width="0.7" opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#00F0FF" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 4px;
      fill: url(#text-grad);
    }
    .badge-text {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #00F0FF;
    }
    .subtitle {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #94A3B8;
    }
    .tag-text {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #10B981;
    }
  </style>

  <!-- Card Background with Rounded Corners -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="60" r="140" fill="#00F0FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="260" r="160" fill="#7000FF" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="160" r="180" fill="#0077B5" opacity="0.05" filter="url(#glow)" />

  <!-- Modern Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyan-glow)" />

  <!-- Terminal Style Window Dots (Top Left) -->
  <g transform="translate(36, 32)">
    <circle cx="0" cy="0" r="6" fill="#FF5F56" />
    <circle cx="20" cy="0" r="6" fill="#FFBD2E" />
    <circle cx="40" cy="0" r="6" fill="#27C93F" />
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(1010, 30)">
    <rect x="0" y="0" width="154" height="28" rx="14" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" filter="url(#subtle-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18" class="status-text">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Developer Role Super-Badge -->
  <g transform="translate(600, 75)">
    <rect x="-190" y="0" width="380" height="30" rx="15" fill="#1E293B" fill-opacity="0.7" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="20" text-anchor="middle" class="badge-text">⚡ FULL APP &amp; WEB DEVELOPER</text>
  </g>

  <!-- Hero Title: PRATIK SOLANKE -->
  <text x="600" y="165" text-anchor="middle" class="title" filter="url(#subtle-glow)">PRATIK SOLANKE</text>

  <!-- Subtitle with Architectural Focus -->
  <text x="600" y="212" text-anchor="middle" class="subtitle">
    MOBILE ARCHITECT • FULL-STACK ENGINEER • EDGE-AI INNOVATOR
  </text>

  <!-- Bottom Accent Horizontal Rule -->
  <line x1="300" y1="240" x2="900" y2="240" stroke="url(#cyan-glow)" stroke-width="1.5" opacity="0.6" />

  <!-- Technology Highlight Pills -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: Android Native -->
    <g transform="translate(-360, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#111827" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="5" text-anchor="middle" class="tag-text">📱 Kotlin &amp; Compose</text>
    </g>

    <!-- Pill 2: React & Next.js -->
    <g transform="translate(-120, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#111827" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="5" text-anchor="middle" class="tag-text">🌐 React &amp; Next.js</text>
    </g>

    <!-- Pill 3: Node & NestJS -->
    <g transform="translate(120, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#111827" stroke="#E0234E" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="5" text-anchor="middle" class="tag-text">⚙️ Node &amp; NestJS</text>
    </g>

    <!-- Pill 4: Edge AI & Vision -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#111827" stroke="#A855F7" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="5" text-anchor="middle" class="tag-text">🧠 Edge AI &amp; Vision</text>
    </g>
  </g>

  <!-- Bottom Cyber Glow Strip -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#cyan-glow)" />
</svg>

